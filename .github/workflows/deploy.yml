name: Deploy PRAXIS

# Gated on the CI workflow (backend pytest + frontend build) succeeding on main — a
# push to main no longer deploys straight from git pull with zero tests run. The
# workflow_dispatch path stays available for a manual deploy that bypasses CI on
# purpose (e.g. redeploying an unchanged image after an infra-only change).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /opt/praxis

            # Pull latest code
            echo "Pulling latest code..."
            git pull origin main

            # Build images
            echo "Building Docker images..."
            docker compose -f docker-compose.prod.yml build

            # Restart services with new images
            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate api worker frontend nginx

            # Wait for health check
            echo "Waiting for API to become healthy..."
            for i in $(seq 1 30); do
                if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
                    echo "API is healthy!"
                    break
                fi
                echo "  Attempt $i/30..."
                sleep 5
            done

            # Clean up old images
            docker image prune -f

            echo "Deployment complete: $(git rev-parse --short HEAD)"
