name: Deploy PRAXIS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: praxis-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        vars.ENABLE_EC2_DEPLOY == 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
      AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: praxis-${{ github.run_id }}

      - name: Publish and deploy release
        run: ./deploy/aws/github-deploy.sh "$RELEASE_SHA"
