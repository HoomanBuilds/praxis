# PRAXIS — Production Docker Compose
# Run with: docker compose -f docker-compose.prod.yml up -d
# Requires: .env file with production secrets

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-praxis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-praxis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-praxis}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  chromadb:
    image: chromadb/chroma:0.5.20
    volumes:
      - chromadata:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080 --workers 2
    environment:
      PRAXIS_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-praxis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-praxis}
      PRAXIS_REDIS_URL: redis://redis:6379/0
      PRAXIS_CHROMA_HOST: chromadb
      PRAXIS_CHROMA_PORT: "8000"
      PRAXIS_OLLAMA_HOST: http://ollama:11434
      PRAXIS_LLM_MODEL: ${PRAXIS_LLM_MODEL:-llama3.1:8b}
      PRAXIS_DOC_STORE_PATH: /app/data/documents
      PRAXIS_CORPUS_PATH: /app/data/corpus
      PRAXIS_EXPORT_PATH: /app/data/exports
      PRAXIS_ORG_CONFIG_PATH: /app/data/org_config.json
      PRAXIS_API_KEY: ${PRAXIS_API_KEY:?Set PRAXIS_API_KEY in .env}
      PRAXIS_JWT_SECRET: ${PRAXIS_JWT_SECRET:?Set PRAXIS_JWT_SECRET in .env}
      PRAXIS_FRONTEND_URL: https://praxis.inferia.ai
    volumes:
      - praxisdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m ingestion.worker
    environment:
      PRAXIS_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-praxis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-praxis}
      PRAXIS_REDIS_URL: redis://redis:6379/0
      PRAXIS_CHROMA_HOST: chromadb
      PRAXIS_CHROMA_PORT: "8000"
      PRAXIS_OLLAMA_HOST: http://ollama:11434
      PRAXIS_LLM_MODEL: ${PRAXIS_LLM_MODEL:-llama3.1:8b}
      PRAXIS_DOC_STORE_PATH: /app/data/documents
      PRAXIS_CORPUS_PATH: /app/data/corpus
      PRAXIS_EXPORT_PATH: /app/data/exports
      PRAXIS_ORG_CONFIG_PATH: /app/data/org_config.json
      PRAXIS_API_KEY: ${PRAXIS_API_KEY}
    volumes:
      - praxisdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - frontend
      - api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  chromadata:
  ollamadata:
  praxisdata:

networks:
  internal:
    driver: bridge
