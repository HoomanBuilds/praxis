<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>PRAXIS · Agentic Compliance</title>
    <script>
      // Apply theme before paint to avoid a flash. Defaults to light.
      try {
        var t = localStorage.getItem("praxis-theme-v2") || "light";
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
